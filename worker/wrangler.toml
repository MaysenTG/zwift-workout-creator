name = "zwo-builder-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[observability]
enabled = true

[dev]
port = 8787

# Per–backup-code library storage. Created automatically for local + production.
[[durable_objects.bindings]]
name = "LIBRARY"
class_name = "LibraryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LibraryDO"]

# ~20 generate calls / minute / client IP
[[ratelimits]]
name = "GENERATE_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
