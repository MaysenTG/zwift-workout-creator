name: Deploy to Cloudflare

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          # Set repository secret VITE_API_BASE to your worker URL, e.g.
          # https://zwo-builder-api.<account>.workers.dev
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          # Optional: EthicalAds (see .env.example)
          VITE_ADS: ${{ secrets.VITE_ADS }}
          VITE_ETHICAL_ADS_PUBLISHER: ${{ secrets.VITE_ETHICAL_ADS_PUBLISHER }}

      - name: Deploy Worker API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zwo-builder
